name: 验证与发布 iOS Workflow

on:
  push:
    branches: [main]
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: 检出待验证版本
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: 验证工作流
        run: python3 -m unittest discover -s tests -v

  generated-builds:
    runs-on: macos-15
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        case: [swift-uikit-5, swift-uikit-6, swiftui-5, swiftui-6, objc-uikit]
    steps:
      - name: 检出待验证版本
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: 准备 XcodeGen
        run: command -v xcodegen || brew install xcodegen
      - name: 无签名编译生成源码与测试 target
        run: python3 scripts/check_generated_projects.py --case "${{ matrix.case }}" --output "$RUNNER_TEMP/ios-workflow-${{ matrix.case }}"
      - name: 输出实际构建摘要
        if: always()
        run: |
          report="$RUNNER_TEMP/ios-workflow-${{ matrix.case }}/.ios-workflow/artifacts/build-report.json"
          if [ -f "$report" ]; then cat "$report"; fi

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [tests, generated-builds]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出发布版本
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: 生成分发包
        run: python3 scripts/build_distribution.py --version "$GITHUB_REF_NAME" --output dist
      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "iOS Workflow $GITHUB_REF_NAME"
