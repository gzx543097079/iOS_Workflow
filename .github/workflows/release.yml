name: 验证与发布 iOS Workflow

on:
  push:
    branches: [main]
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: 检出待验证版本
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: 验证工作流
        run: python3 -m unittest discover -s tests -v

  generated-builds:
    runs-on: macos-15
    timeout-minutes: 25
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    strategy:
      fail-fast: false
      matrix:
        case: [swift-uikit-5, swift-uikit-6, swiftui-5, swiftui-6, objc-uikit]
    steps:
      - name: 检出待验证版本
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: 准备 XcodeGen
        run: command -v xcodegen || brew install xcodegen
      - name: 确认固定 Xcode 环境
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
      - name: 无签名编译生成源码与测试 target
        run: python3 scripts/check_generated_projects.py --case "${{ matrix.case }}" --output "$RUNNER_TEMP/ios-workflow-${{ matrix.case }}"
      - name: 输出实际构建摘要
        if: always()
        run: |
          report="$RUNNER_TEMP/ios-workflow-${{ matrix.case }}/.ios-workflow/artifacts/build-report.json"
          if [ -f "$report" ]; then cat "$report"; fi

  demo-tests:
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: 检出待验证版本
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: 准备 XcodeGen
        run: command -v xcodegen || brew install xcodegen
      - name: 实际执行 Demo 单元和 UI 测试
        run: >-
          python3 scripts/check_demo_tests.py
          --output "$RUNNER_TEMP/workflow-demo-tests"
          --expected-xcode 16.4 --runtime 18.5 --device-name "iPhone 16 Pro"
      - name: 输出实际测试摘要
        if: always()
        run: |
          summary="$RUNNER_TEMP/workflow-demo-tests/test-summary.md"
          if [ -f "$summary" ]; then cat "$summary" >> "$GITHUB_STEP_SUMMARY"; fi
      - name: 保存测试报告和 xcresult
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: workflow-demo-test-results
          retention-days: 14
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/workflow-demo-tests/test-report.json
            ${{ runner.temp }}/workflow-demo-tests/test-summary.md
            ${{ runner.temp }}/workflow-demo-tests/xcresult-*.json
            ${{ runner.temp }}/workflow-demo-tests/test.log
            ${{ runner.temp }}/workflow-demo-tests/DemoTests.xcresult

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [tests, generated-builds, demo-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 检出发布版本
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: 生成分发包
        run: python3 scripts/build_distribution.py --version "$GITHUB_REF_NAME" --output dist
      - name: 创建 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "iOS Workflow $GITHUB_REF_NAME"
